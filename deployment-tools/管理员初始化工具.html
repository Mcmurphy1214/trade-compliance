<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>管理员初始化工具 · 本地运行</title><style>body{font:15px/1.8 system-ui,'Microsoft YaHei',sans-serif;background:#f0f4f8;color:#19324b;padding:32px}main{max-width:760px;margin:auto;background:white;padding:30px;border-radius:12px}h1{font-size:24px}label{display:block;margin:15px 0}input{display:block;padding:10px;width:95%;border:1px solid #ccd7e3;border-radius:6px;font-size:15px}button,a.download{background:#245dcc;color:white;border:0;border-radius:6px;padding:12px 20px;font-size:15px;cursor:pointer;display:inline-block;text-decoration:none;margin:8px 8px 8px 0}textarea{width:100%;height:240px;box-sizing:border-box;font:12px/1.6 monospace}.note{background:#f5f7fa;padding:14px;border-left:3px solid #245dcc}.error{color:#b11e3b}small{color:#657a92}</style></head><body><main><h1>管理员初始化工具</h1><p class="note">此文件在你的电脑本地运行，不发送网络请求。它只生成密码哈希及初始化SQL；不会连接或修改任何数据库。</p><p>先在Cloudflare新建D1数据库，并执行“数据库初始化.sql”。再填写下列信息，将生成的SQL复制到<strong>该D1数据库的控制台</strong>执行。</p><form id="form"><label>管理员账号<input id="username" minlength="3" maxlength="40" required pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{2,39}" autocomplete="off" placeholder="3至40位英文、数字、_.-"></label><label>显示名称<input id="displayName" required maxlength="80" autocomplete="off"></label><label>初始密码<input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>再次输入初始密码<input id="confirm" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button type="submit">生成初始化SQL</button></form><p id="error" class="error" role="alert"></p><section id="result" hidden><h2>复制到D1控制台执行</h2><textarea id="sql" readonly aria-label="管理员初始化SQL"></textarea><a id="download" class="download">下载SQL</a><button id="copy" type="button">复制SQL</button><p>SQL只会在<strong>成员表为空</strong>时创建一个管理员，不会覆盖已有账号。首次登录工作台后仍需修改初始密码。</p><small>此SQL包含密码哈希，请只在自己的数据库中执行；不要将生成的SQL放入网站上传ZIP或发给其他人。</small></section></main><script>
const el=id=>document.getElementById(id),q=s=>"'"+s.replaceAll("'","''")+"'";let link;
el('form').addEventListener('submit',async e=>{e.preventDefault();el('error').textContent='';el('result').hidden=true;try{
 const username=el('username').value.trim().toLowerCase(),name=el('displayName').value.trim(),password=el('password').value;
 if(!/^[a-z0-9][a-z0-9_.-]{2,39}$/.test(username)||!name||name.length>80)throw Error('请检查账号和显示名称。');
 if(password.length<12||password.length>128||password!==el('confirm').value)throw Error('密码长度须为12至128位，且两次输入一致。');
 if(!crypto.subtle)throw Error('当前浏览器不支持本地Web Crypto，请用最新版Edge或Chrome直接打开本文件。');
 const hex=b=>Array.from(new Uint8Array(b),n=>n.toString(16).padStart(2,'0')).join(''),salt=hex(crypto.getRandomValues(new Uint8Array(32))),id=crypto.randomUUID(),now=new Date().toISOString();
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
 const hash=hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},key,256));
 const sql='INSERT INTO workspace_users(id,username,display_name,role,password_hash,salt,disabled,must_change_password,version,last_mutation,created_at,updated_at) SELECT '+[id,username,name,'admin',hash,salt].map(q).join(',')+",0,1,1,'',"+[now,now].map(q).join(',')+' WHERE NOT EXISTS(SELECT 1 FROM workspace_users);\nSELECT username,role,must_change_password FROM workspace_users;';
 el('sql').value=sql;el('result').hidden=false;el('password').value='';el('confirm').value='';if(link)URL.revokeObjectURL(link);link=URL.createObjectURL(new Blob([sql],{type:'text/plain;charset=utf-8'}));el('download').href=link;el('download').download='initial-admin-private.sql';
 }catch(error){el('error').textContent=error.message||'生成失败，请重试。'}});
el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(el('sql').value);el('copy').textContent='已复制';}catch{el('sql').select();el('copy').textContent='请按Ctrl+C复制';}});
</script></body></html>
